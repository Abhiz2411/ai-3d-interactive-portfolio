# aichat.abhijitzende.com -> Node chatbot on 127.0.0.1:3001
# Rate-limit zones go in the http context; this file is included from there
# via sites-enabled, so declaring them at top level is correct.
limit_req_zone $binary_remote_addr zone=aichat_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=aichat_page:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name aichat.abhijitzende.com;

    client_max_body_size 16k;

    # Node sets the other security headers (nosniff, frame, referrer, CSP).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/chat {
        limit_req zone=aichat_api burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Server-sent events: no buffering, allow slow streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location / {
        limit_req zone=aichat_page burst=30 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
